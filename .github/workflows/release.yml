# The release on a tag vX.Y.Z: the check, the plugin zip and its digest, published
# as a GitHub release with the version's changelog section and the sponsorship
# footer as its notes. Run by hand it builds everything and publishes nothing.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: check, package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version plugin/package.json carries, and the changelog has its section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' plugin/package.json | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, plugin/package.json carries $version" >&2; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - run: shellcheck -S warning plugin/install.sh plugin/uninstall.sh scripts/*.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from and carries the modules and the database
        run: |
          unzip -p dist/pi_screen_setup-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
          for module in body-parser express fs-extra kew v-conf; do
            unzip -l dist/pi_screen_setup-*.zip | grep -q " node_modules/$module/package.json\$" || { echo "no module $module in the zip" >&2; exit 1; }
          done
          unzip -p dist/pi_screen_setup-*.zip display_presets.json | grep -q '"presets"'
      - run: ( cd dist && sha256sum ./*.zip > SHA256SUMS )
      - uses: actions/upload-artifact@v7
        with:
          name: release-plugin
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-plugin
          path: dist
      - name: Notes from the changelog, with the sponsorship footer
        run: |
          {
            scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
            printf '\n'
            cat .github/release-footer.md
          } > dist/notes.md
      # Published as a pre-release: no player is offered it, but one asked for it by
      # version. It is made the latest by hand once it has been tried
      # (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --prerelease \
            dist/pi_screen_setup-*.zip dist/SHA256SUMS
