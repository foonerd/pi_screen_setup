# The check on every push and pull request, and the plugin zip as a build artefact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: static check, shell lint, plugin zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: edid-decode, for the conformance check of every EDID the database can produce
        run: sudo apt-get install -y --no-install-recommends edid-decode
      - run: npm test
      - run: test "$(node --test test/hdmi.test.js 2>&1 | grep -c 'edid-decode not on the PATH')" = 0
      - run: shellcheck -S warning plugin/install.sh plugin/uninstall.sh plugin/scripts/*.sh scripts/*.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from and carries the modules, the database and the root helper
        run: |
          unzip -p dist/pi_screen_setup-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
          for module in body-parser express fs-extra kew v-conf; do
            unzip -l dist/pi_screen_setup-*.zip | grep -q " node_modules/$module/package.json\$" || { echo "no module $module in the zip" >&2; exit 1; }
          done
          unzip -p dist/pi_screen_setup-*.zip display_presets.json | grep -q '"presets"'
          unzip -l dist/pi_screen_setup-*.zip | grep -q ' scripts/pi-screen-setup-root.sh$' || { echo 'no root helper in the zip' >&2; exit 1; }
          unzip -l dist/pi_screen_setup-*.zip | grep -q ' overlays/manifest.json$' || { echo 'no overlay manifest in the zip' >&2; exit 1; }
          test "$(unzip -l dist/pi_screen_setup-*.zip | grep -c ' overlays/pss-.*\.dtbo$')" = "$(unzip -p dist/pi_screen_setup-*.zip overlays/manifest.json | grep -c '"file":')" || { echo 'the zip does not carry every overlay the manifest names' >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/*.zip
          if-no-files-found: error
